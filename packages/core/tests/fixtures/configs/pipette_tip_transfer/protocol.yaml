# Offline pipette/tip protocol fixture for digital-sim replay.

# The sequence intentionally exercises attached-tip state:
#   1. pick up a disposable tip from a TipRack with positive tip_length
#   2. transfer liquid with distinct source/destination labware-relative heights
#   3. blow out above the destination
#   4. drop the tip and return home with bare-pipette depth

protocol:
  - home:

  - pick_up_tip:
      position: tip_rack.A1

  - transfer:
      source: plate.A1
      destination: plate.B1
      volume_ul: 50.0
      source_height: -2.0
      destination_height: 4.0

  - blowout:
      position: plate.B1
      height: 6.0

  - drop_tip:
      position: tip_disposal.discard

  - home:
