# Sartorius Picus 2 bring-up: transfer 100 uL from s1 (water) to s2 (dmfc).
# transfer = aspirate at source + dispense at destination in one command;
# the engine requires a tracked tip, so this picks one up from the rack
# first and drops it in the disposal after.
#
# Heights are labware-relative to the vial mouth (deck z = -15): negative
# goes down into the vial. Tune to actual fill levels before running —
# the aspirate must reach liquid, the dispense should stay above it.
#
#   PYTHONPATH=packages/core/src .venv/bin/python -m cubos.tools.run_protocol #     packages/core/configs/gantry/cub_xl_panda_home_origin_full.yaml #     packages/core/configs/deck/panda-deck.yaml #     packages/core/configs/protocol/sartorius_s1_to_s2.yaml [--mock]

protocol:
  - home:

  - pick_up_tip:
      position: tip_rack.A1

  - transfer:
      source: s1
      destination: s2
      volume_ul: 100
      source_height: -30.0
      destination_height: -15.0

  - drop_tip:
      position: tip_disposal
