# bear-den Genmitsu ProVerXL 4030 V2 retrofitted with a Duet 3 MB6XD
# (RepRapFirmware 3.6.1). Motion configuration — axis directions, steps/mm,
# soft limits, homing to the back-right-top corner, 3 mm pull-off reserve —
# lives in the board's config.g (see configs/duet/proverxl_4030v2/), not in
# runtime-writable settings, so there is no grbl_settings block.
#
# Machine coordinates equal the deck frame (FLB origin) by construction:
# the board's M208 limits are the usable spans and homing G92s the
# backed-off position to the axis maxima. Bench-verified 2026-08-07:
# homing repeatability at ruler precision, travel margins ~10/15/7 mm
# beyond the M208 minima before switch contact.
serial_port: "/dev/serial/by-id/usb-Duet_3D_Duet-if00"
gantry_type: cub_xl
firmware: duet
cnc:
  factory_z_travel_mm: 110.0
  y_axis_motion: head
  safe_z: 100.0
working_volume:
  x_min: 0.0
  x_max: 400.0
  y_min: 0.0
  y_max: 300.0
  z_min: 0.0
  z_max: 110.0
instruments: {}
