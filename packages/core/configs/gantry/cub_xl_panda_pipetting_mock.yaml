# Simulation only. Pairs with deck/panda_imported_deck_pipetting_mock.yaml.
# The 401 × 301 × 250 mm simulated travel is translated to deck zero.
# Its Z travel and safe height are simulation values, never hardware settings.

cnc:
  default_feed_rate_mm_min: 3000.0
  factory_z_travel_mm: 250.0
  safe_z: 80.0
  y_axis_motion: head
gantry_type: cub_xl
grbl_settings:
  dir_invert_mask: 1
  homing_dir_mask: 0
  homing_enable: true
  max_travel_x: 401.0
  max_travel_y: 301.0
  max_travel_z: 250.0
  status_report: 0
  steps_per_mm_x: 400.0
  steps_per_mm_y: 400.0
  steps_per_mm_z: 400.0
instruments:
  camera:
    depth: 0.0
    offline: true
    offset_x: 0.0
    offset_y: 0.0
    type: camera
    vendor: mount_only
  pipette:
    depth: 100.0
    offline: true
    offset_x: 115.9
    offset_y: 6.1
    pipette_model: p300_single_gen2
    port: ''
    type: pipette
    vendor: opentrons
  potentiostat:
    channel: 0
    depth: 100.0
    offline: true
    offset_x: -56.7
    offset_y: 3.8
    port: ''
    type: potentiostat
    vendor: admiral
  vial_capper_decapper:
    capture_retries: 2
    capture_settle_s: 1.0
    depth: 61.5
    engage_depth_mm: -15.0
    offline: true
    offset_x: 62.9
    offset_y: 5.1
    port: ''
    type: capper
    vendor: pawduino
origin_policy: deck_origin
serial_port: /dev/offline-panda-mock
working_volume:
  x_max: 401.0
  x_min: 0.0
  y_max: 301.0
  y_min: 0.0
  z_max: 250.0
  z_min: 0.0
