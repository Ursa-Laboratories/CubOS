# MOCK-ONLY companion to deck/panda_imported_deck.yaml, for running real
# `pipette`-instrument motion (pick_up_tip / transfer / drop_tip) against
# the PANDA-BEAR-imported labware identities in MOCK mode. Do NOT use this
# file to drive real hardware -- see gantry/cub_xl_panda_pipetting_mock.yaml
# for the full explanation of why panda_imported_deck.yaml itself cannot
# satisfy bounds validation for any non-camera instrument today.
#
# Every field is identical to deck/panda_imported_deck.yaml (same labware
# keys, roles, solutions, capacities, calibration shape, X/Y coordinates --
# the pipette's offset_x/offset_y are small relative to the 401x301mm
# working volume, so X/Y bounds hold for the vials/tip rack/disposal either
# way) EXCEPT (a) ito_pama_plate's calibration X, moved from -356.5 to
# -240.0 because `gantry_x = -356.5 - offset_x(115.9) = -472.4` falls
# outside working_volume x_min=-401.0 (the same double-offset blocker
# documented in the gantry mock's header, in X form), and (b) the
# pipette-frame Z values (vial `location.z`, well-plate/tip-rack `calibration.a1.z`,
# tip-rack `pickup_z`/`drop_z`, tip-disposal `location.z` /
# `slots.discard.location.z`), which are replaced with placeholder values
# chosen so `gantry_z = target_z + pipette.depth(100.0) [+ tip_extension
# (59.3, tip_rack.tip_length)]` lands inside working_volume [-85, 0] for
# both tip_rack (pickup happens before any tip is attached) and every
# other pipette-frame target (touched only after tip pickup in these
# protocols, so tip_extension always applies), while also sitting at or
# below the gantry's safe_z (-170.0; protocol-semantics rule: every
# resolved action Z must satisfy z <= safe_z): -180.0 for tip_rack, -200.0
# for everything else. `e1` (electrode-frame; never targeted by the
# `pipette` instrument) is left untouched. These Z values are NOT measured
# from real PANDA-BEAR hardware -- panda_import_report.json's real
# conflict/warning data is untouched by this file.
#
# panda_initial_fluids.yaml (unchanged, real production-imported volumes/
# compositions) seeds against this deck exactly as it does against
# deck/panda_imported_deck.yaml -- labware keys and capacities are
# byte-identical, so fluid-state tracking here exercises the real imported
# data, only motion bounds differ.

