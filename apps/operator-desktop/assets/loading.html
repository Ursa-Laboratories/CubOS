<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CubOS</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI Variable", "Segoe UI", sans-serif;
        background: #0b0f14;
        color: #f6f8fa;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b0f14;
      }
      main {
        display: grid;
        justify-items: center;
        gap: 22px;
      }
      img {
        width: 128px;
        height: 128px;
        border-radius: 24px;
        box-shadow: 0 18px 46px rgb(0 0 0 / 35%);
      }
      h1 {
        margin: 0;
        font-size: 30px;
        font-weight: 650;
        letter-spacing: 0;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #9ca9b8;
        font-size: 14px;
      }
      .indicator {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #22d3a6;
        box-shadow: 0 0 0 0 rgb(34 211 166 / 45%);
        animation: pulse 1.4s ease-out infinite;
      }
      @keyframes pulse {
        70% {
          box-shadow: 0 0 0 8px rgb(34 211 166 / 0%);
        }
        100% {
          box-shadow: 0 0 0 0 rgb(34 211 166 / 0%);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="./cubos-icon.png" alt="" />
      <h1>CubOS</h1>
      <div class="status"><span class="indicator"></span>Starting</div>
    </main>
  </body>
</html>
