services:
  cubos:
    image: ghcr.io/ursa-laboratories/cubos-appliance:v1.0.0@sha256:REPLACE_WITH_DIGEST
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    ports:
      - "8742:8742"
    environment:
      CUB_IMAGE_DIGEST: sha256:REPLACE_WITH_DIGEST
      ZOO_API_TOKEN_FILE: /run/secrets/cub_api_token
      ZOO_TRUSTED_HOSTS: '["cub.local","cub.local:8742"]'
    volumes:
      - /var/lib/cub:/var/lib/cub
    devices:
      - /dev/serial/by-id/REPLACE_WITH_GANTRY_DEVICE:/dev/cub-gantry
    secrets:
      - cub_api_token
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

secrets:
  cub_api_token:
    file: /etc/cub/secrets/api-token
