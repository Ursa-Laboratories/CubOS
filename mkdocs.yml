site_name: CubOS
site_description: Documentation for CubOS, the CNC-based lab automation platform.
theme:
  name: readthedocs

nav:
  - Home: index.md
  - Set Up and Use CubOS:
    - Getting Started: getting-started.md
    - Gantry Bring-Up: admin/gantry-bring-up.md
    - Calibrate Gantry: calibration.md
    - Set Up Deck and Labware: deck.md
    - Run a Protocol with YAML: protocol-yaml.md
    - Data: data.md
    - Troubleshooting & Recovery: troubleshooting.md
  - Contributing to CubOS:
    - Overview: contributing.md
    - Development Setup: development.md
    - Gantry Internals: gantry.md
    - Deck Internals: deck-internals.md
    - Python Protocols: protocol-python.md
    - YAML File Overview: configuration.md
    - Appendix: appendix.md
  - API Reference:
    - Overview: reference/index.md
    - deck: reference/src/deck/index.md
    - gantry: reference/src/gantry/index.md
    - instruments: reference/src/instruments/index.md
    - protocol_engine:
      - Overview: reference/src/protocol_engine/index.md
      - Commands:
        - move: reference/src/protocol_engine/commands/move.md
        - scan: reference/src/protocol_engine/commands/scan.md
        - measure: reference/src/protocol_engine/commands/measure.md
        - pipette: reference/src/protocol_engine/commands/pipette.md
        - home: reference/src/protocol_engine/commands/home.md
        - pause: reference/src/protocol_engine/commands/pause.md
    - validation: reference/src/validation/index.md
    - data: reference/data/index.md

not_in_nav: |
  agent-index.md
  reference/src/**
  reference/data/**

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
            - .
          options:
            members_order: source
            merge_init_into_class: true
            show_root_heading: true
            show_root_toc_entry: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_source: false
            separate_signature: true
            signature_crossrefs: true
            show_signature_annotations: true
            unwrap_annotated: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true
