# A2 lateral camera-position study after a single 10 uL dispense.
# Nine X positions span 8 mm in 1 mm increments: -4 mm (left) to +4 mm (right).
# Each position captures one white-light image at relative image height 122.8 mm.
protocol:
- pick_up_tip:
    position: tip_rack_green.A8
    speed: 50
- decap:
    instrument: capper
    vial: vial_rack.A1
- aspirate:
    position: vial_rack.A1
    volume_ul: 10
    speed: 50
    height: -10
- cap:
    instrument: capper
    vial: vial_rack.A1
- dispense:
    position: ursa_wellplate.A2
    volume_ul: 10
    speed: 50
    height: 21
- image_well:
    camera: camera
    well: ursa_wellplate.A2
    image_height: 122.8
    x_offset_mm: -4
    y_offset_mm: 0
    light: white
    mode: standard
    lights: lights
    brightness: 25
    label: left_4mm_ursa_wellplate.A2_after_dispense_white_height_122p8mm
- image_well:
    camera: camera
    well: ursa_wellplate.A2
    image_height: 122.8
    x_offset_mm: -3
    y_offset_mm: 0
    light: white
    mode: standard
    lights: lights
    brightness: 25
    label: left_3mm_ursa_wellplate.A2_after_dispense_white_height_122p8mm
