# Three-well 5 uL contact-angle X-sweep using one tip.
#
# For A1, A2, and A3:
# - decap vial A1, aspirate 5 uL at the established -15 mm height, and recap;
# - blow out at the established +21 mm well height;
# - wait 1 second, then capture one white-light image at image height 123.4 mm
#   for every X offset from -4 mm (left) through +4 mm (right), in 1 mm steps;
# - return the pipette piston home after imaging and before the next decap.

protocol:
  - pick_up_tip:
      position: tip_rack_green.A1
      speed: 50
  - decap:
      instrument: capper
      vial: vial_rack.A1
  - aspirate:
      position: vial_rack.A1
      volume_ul: 5
      speed: 50
      height: -15
  - cap:
      instrument: capper
      vial: vial_rack.A1
  - blowout:
      position: ursa_wellplate.A1
      speed: 50
      height: 21
  - pause:
      seconds: 1
  - image_well:
      camera: camera
      well: ursa_wellplate.A1
      image_height: 123.4
      x_offset_mm: -4
      y_offset_mm: 0
      lights: lights
      light: white
      mode: standard
      brightness: 25
      label: left_4mm_A1_5uL_height_123p4mm
  - image_well:
      camera: camera
      well: ursa_wellplate.A1
      image_height: 123.4
      x_offset_mm: -3
      y_offset_mm: 0
      lights: lights
      light: white
      mode: standard
      brightness: 25
      label: left_3mm_A1_5uL_height_123p4mm
  - image_well:
      camera: camera
      well: ursa_wellplate.A1
      image_height: 123.4
      x_offset_mm: -2
      y_offset_mm: 0
      lights: lights
      light: white
      mode: standard
      brightness: 25
