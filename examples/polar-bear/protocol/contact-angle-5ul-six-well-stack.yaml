# Six-well 5 uL contact-angle run using one tip.
#
# For every destination well:
# - decap vial A1, aspirate 5 uL at height -45 mm, and recap;
# - blow out the full aspirated volume at the established +21 mm well height;
# - capture the established 10-plane white-light stack (125.0 to 123.2 mm);
# - return the pipette piston home after imaging, immediately before the next decap.

protocol:
- pick_up_tip:
    position: tip_rack_green.A1
    speed: 50
- decap:
    instrument: capper
    vial: vial_rack.A1
- aspirate:
    position: vial_rack.A1
    volume_ul: 5
    speed: 50
    height: -45
- cap:
    instrument: capper
    vial: vial_rack.A1
- blowout:
    position: ursa_wellplate.A1
    speed: 50
    height: 21
- image_well:
    camera: camera
    well: ursa_wellplate.A1
    image_height: 125
    light: white
    mode: curvature
    z_steps: 10
    z_step_mm: 0.2
    lights: lights
    brightness: 25
    label: ursa_wellplate.A1_5uL_after_blowout_white
- pipette_home: null
- decap:
    instrument: capper
    vial: vial_rack.A1
- aspirate:
    position: vial_rack.A1
    volume_ul: 5
    speed: 50
    height: -45
- cap:
