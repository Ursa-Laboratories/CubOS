# Three-well 5 uL contact-angle continuous X-sweep using one tip.
#
# For A3, A4, and B1:
# - decap vial A1, aspirate 5 uL at the established -15 mm height, and recap;
# - blow out at the established +21 mm well height;
# - wait 1 second, then descend once to image height 123.4 mm and capture
#   every X offset from -4 mm (left) through +4 mm (right), in 1 mm steps;
# - move directly between X offsets at image height and retract only after
#   the final image;
# - return the pipette piston home after imaging and before the next decap.

protocol:
  - pick_up_tip:
      position: tip_rack_green.A1
      speed: 50
  - decap:
      instrument: capper
      vial: vial_rack.A1
  - aspirate:
      position: vial_rack.A1
      volume_ul: 5
      speed: 50
      height: -15
  - cap:
      instrument: capper
      vial: vial_rack.A1
  - blowout:
      position: ursa_wellplate.A3
      speed: 50
      height: 21
  - pause:
      seconds: 1
  - image_well:
      camera: camera
      well: ursa_wellplate.A3
      image_height: 123.4
      x_sweep_start_mm: -4
      x_sweep_stop_mm: 4
      x_sweep_step_mm: 1
      y_offset_mm: 0
      lights: lights
      light: white
      mode: standard
      brightness: 25
      label: A3_5uL_height_123p4mm
  - pipette_home: null
  - decap:
      instrument: capper
      vial: vial_rack.A1
  - aspirate:
      position: vial_rack.A1
      volume_ul: 5
      speed: 50
      height: -15
  - cap:
      instrument: capper
      vial: vial_rack.A1
  - blowout:
      position: ursa_wellplate.A4
      speed: 50
      height: 21
  - pause:
      seconds: 1
  - image_well:
      camera: camera
      well: ursa_wellplate.A4
      image_height: 123.4
      x_sweep_start_mm: -4
      x_sweep_stop_mm: 4
      x_sweep_step_mm: 1
      y_offset_mm: 0
      lights: lights
      light: white
      mode: standard
      brightness: 25
      label: A4_5uL_height_123p4mm
  - pipette_home: null
  - decap:
      instrument: capper
      vial: vial_rack.A1
  - aspirate:
      position: vial_rack.A1
      volume_ul: 5
      speed: 50
      height: -15
  - cap:
      instrument: capper
      vial: vial_rack.A1
  - blowout:
      position: ursa_wellplate.B1
      speed: 50
      height: 21
  - pause:
      seconds: 1
  - image_well:
      camera: camera
      well: ursa_wellplate.B1
      image_height: 123.4
      x_sweep_start_mm: -4
      x_sweep_stop_mm: 4
      x_sweep_step_mm: 1
      y_offset_mm: 0
      lights: lights
      light: white
      mode: standard
      brightness: 25
      label: B1_5uL_height_123p4mm
  - pipette_home: null
  - drop_tip:
      position: tip_disposal_1
      speed: 50
