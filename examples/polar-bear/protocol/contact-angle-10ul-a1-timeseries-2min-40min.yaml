# Ten-microlitre A1 contact-angle time series.
#
# Dispenses 10 uL from vial A1 into well A1, captures the calibrated
# 10-plane white-light stack at time zero, then repeats after each 120 s
# pause through the nominal 40 minute point. Each label records its
# nominal elapsed minute.

protocol:
  - pick_up_tip:
      position: tip_rack_green.A1
      speed: 50
  - decap:
      instrument: capper
      vial: vial_rack.A1
  - aspirate:
      position: vial_rack.A1
      volume_ul: 10
      speed: 50
      height: -15
  - cap:
      instrument: capper
      vial: vial_rack.A1
  - blowout:
      position: ursa_wellplate.A1
      speed: 50
      height: 21
  - pause:
      seconds: 1
      reason: allow droplet to settle
  - image_well:
      camera: camera
      well: ursa_wellplate.A1
      image_height: 125
      lights: lights
      light: white
      mode: curvature
      brightness: 25
      z_steps: 10
      z_step_mm: 0.2
      label: A1_10uL_timeseries_t00min
  - pipette_home: null
  - drop_tip:
      position: tip_disposal_1
      speed: 50
  - pause:
      seconds: 120
      reason: wait for nominal t=2 min measurement
  - image_well:
      camera: camera
      well: ursa_wellplate.A1
      image_height: 125
      lights: lights
      light: white
      mode: curvature
      brightness: 25
      z_steps: 10
      z_step_mm: 0.2
      label: A1_10uL_timeseries_t02min
