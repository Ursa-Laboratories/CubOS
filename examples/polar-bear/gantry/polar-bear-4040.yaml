# Polar Bear contact-angle station. Instrument offsets, capper engagement
# depth, and the deck frame remain uncalibrated; do not run protocols yet.
serial_port: /dev/serial/by-path/platform-xhci-hcd.0-usb-0:2:1.0-port0
gantry_type: genmitsu_4040_pro_max
origin_policy: deck_origin
cnc:
  default_feed_rate_mm_min: 3000.0
  factory_z_travel_mm: 80.0
  calibration_block_height_mm: 35.0
  y_axis_motion: head
  safe_z: 70.0
working_volume:
  x_min: 0.0
  x_max: 390.0
  y_min: 0.0
  y_max: 390.0
  z_min: 0.0
  z_max: 70.0
grbl_settings:
  dir_invert_mask: 4
  status_report: 0
  soft_limits: false
  hard_limits: true
  homing_enable: true
  homing_dir_mask: 0
  homing_pull_off: 10.0
  steps_per_mm_x: 800.0
  steps_per_mm_y: 800.0
  steps_per_mm_z: 800.0
  max_travel_x: 400.0
  max_travel_y: 400.0
  max_travel_z: 80.0
instruments:
  pipette:
    type: pipette
    vendor: sartorius
    pipette_model: picus2_1ch_10
    port: /dev/serial/by-id/usb-Sartorius_Picus_2_47683878-if00
    baud_rate: 230400
    blowout_go_home: false
    offset_x: 0.0
    offset_y: 0.0
    depth: 0.0
    offline: false
  camera:
    type: camera
    vendor: flir
    camera_id: 0
    backend: aravis
    offset_x: 0.0
    offset_y: 0.0
    depth: 0.0
    offline: false
  lights:
    type: lighting
    vendor: nano_text
    port: /dev/serial/by-path/platform-xhci-hcd.1-usb-0:1.1:1.0-port0
    baud_rate: 115200
    command_timeout: 3.0
    offset_x: 0.0
    offset_y: 0.0
    depth: 0.0
    offline: false
  capper:
    type: capper
    vendor: nano_text
    port: /dev/serial/by-path/platform-xhci-hcd.1-usb-0:1.4:1.0-port0
    baud_rate: 115200
    command_timeout: 3.0
    engage_depth_mm: 0.0
    capture_retries: 2
    capture_settle_s: 1.0
    cap_release_shimmy_y_mm: 5.0
    offset_x: 0.0
    offset_y: 0.0
    depth: 0.0
    offline: false
