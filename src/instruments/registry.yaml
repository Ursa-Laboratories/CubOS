# Supported instruments, their allowed vendors, and driver class paths.
# The gantry machine loaders use this to validate instrument entries and import driver classes.

instruments:
  asmi:
    module: instruments.asmi.driver
    class_name: ASMI
    vendors:
      - vernier

  filmetrics:
    module: instruments.filmetrics.driver
    class_name: Filmetrics
    vendors:
      - kla

  pipette:
    module: instruments.pipette.driver
    class_name: Pipette
    vendors:
      - opentrons

  potentiostat:
    module: instruments.potentiostat.driver
    class_name: Potentiostat
    vendors:
      - admiral

  uv_curing:
    module: instruments.uv_curing.driver
    class_name: UVCuring
    vendors:
      - excelitas

  uvvis_ccs:
    module: instruments.uvvis_ccs.driver
    class_name: UVVisCCS
    vendors:
      - thorlabs

  rpi_camera:
    module: instruments.rpi_camera.driver
    class_name: RPiCamera
    vendors:
      - raspberry_pi
