# TipRack (deck.labware.tip_rack.TipRack) — Ursa 2-column × 15-row tip rack.
#
# Matches the WellPlate calibration pattern: a two-point anchor (`a1`, `a2`)
# plus per-column / per-row offsets, with the full 30-tip grid derived by
# the loader. The definition provides geometry only: measure and set
# `calibration` plus `pickup_z` in each deck YAML before hardware use.

type: tip_rack
name: ursa_tip_rack
model_name: panda_2x15_tip_rack
rows: 15
columns: 2
length: 66.0
width: 138.0
height: 22.0
# Override with the measured disposable tip extension below the bare pipette
# nozzle before using this definition for hardware protocols.
tip_length: 59.3
drop_z: 174.8
x_offset: 8.5
y_offset: 8.5
