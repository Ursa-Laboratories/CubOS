[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cubos-api"
version = "0.1.0"
description = "FastAPI service for the CubOS appliance"
requires-python = ">=3.11"
dependencies = [
    "cubos==0.1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.19.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyserial>=3.5",
]

[project.optional-dependencies]
asmi = ["godirect>=1.2.1"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/cubos_api"]

[tool.pytest.ini_options]
pythonpath = ["src", "../../packages/core/src"]
testpaths = ["tests"]
