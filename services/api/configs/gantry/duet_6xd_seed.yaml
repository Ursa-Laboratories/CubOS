# Seed config for a cub_xl-class gantry driven by a Duet 3 MB6XD running
# RepRapFirmware 3.5+ (firmware: duet). Motion configuration (directions,
# steps/mm, soft limits, homing) lives in the board's config.g, so this
# seed carries no grbl_settings block. Working volume mirrors the
# ProVerXL 4030 V2 reference conversion; adjust to the machine's M208
# spans during bring-up. serial_port ships empty: the driver auto-scans
# for a RepRapFirmware controller (ttyACM/usbmodem) when unset.
serial_port: ""
gantry_type: cub_xl
firmware: duet
cnc:
  factory_z_travel_mm: 110.0
  y_axis_motion: head
  safe_z: 100.0
working_volume:
  x_min: 0.0
  x_max: 400.0
  y_min: 0.0
  y_max: 300.0
  z_min: 0.0
  z_max: 110.0
instruments: {}
