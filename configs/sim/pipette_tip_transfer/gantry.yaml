# Offline Cub XL pipette simulation gantry.
#
# This is intentionally a simulation fixture: it keeps the Cub XL fixed-
# structure model and uses the photo-derived pipette-board mount offset. Its
# safe_z is the tool-tip travel plane; with the attached 59.3 mm P300 tip the
# gantry approach plane remains just below z_max. Do not use this file as a
# hardware setup config.

serial_port: /dev/null
gantry_type: cub_xl
cnc:
  homing_strategy: standard
  factory_z_travel_mm: 129.0
  y_axis_motion: head
  safe_z: 69.0

working_volume:
  x_min: 0.0
  x_max: 307.0
  y_min: 0.0
  y_max: 300.0
  z_min: 0.0
  z_max: 129.0

instruments:
  pipette:
    type: pipette
    vendor: opentrons
    pipette_model: p300_single_gen2
    port: ''
    baud_rate: 115200
    offline: true
    offset_x: 72.0
    offset_y: -6.0
    depth: 0.0
