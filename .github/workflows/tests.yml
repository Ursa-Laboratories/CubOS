name: Tests

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e "packages/core[dev]"

      - name: Run tests
        run: python -m pytest packages/core/tests -q

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: pip install -e "packages/core[docs]"

      - name: Build docs
        run: mkdocs build --strict

  api:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CubOS and API dependencies
        run: |
          pip install -e packages/core
          pip install -e "services/api[dev]"

      - name: Run API tests
        run: python -m pytest services/api/tests -q

  web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/operator-web/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: apps/operator-web
        run: npm ci

      - name: Lint frontend
        working-directory: apps/operator-web
        run: npm run lint

      - name: Test frontend
        working-directory: apps/operator-web
        run: npm run test -- --run

      - name: Build frontend
        working-directory: apps/operator-web
        run: npm run build

  client:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install client
        run: pip install -e "sdk/python[dev]"

      - name: Test client
        run: python -m pytest sdk/python/tests -q
