[project]
name = "cubos"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pyserial",
    "pyyaml",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
# Per-instrument vendor SDKs — opt in only when you actually use that instrument.
# The drivers import these lazily and raise a clear error if missing, so the core
# install (and instruments that don't need them) stays light.
asmi = [
    "godirect>=1.0.0",
]
potentiostat = [
    "SquidstatPyLibrary",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-gen-files>=0.5",
    "mkdocstrings[python]>=0.27",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["data", "data.*", "deck", "deck.*",
           "gantry", "gantry.*", "instruments", "instruments.*",
           "protocol_engine", "protocol_engine.*", "validation", "validation.*"]

[tool.setuptools.package-data]
"instruments" = ["registry.yaml"]
"gantry.gantry_driver" = ["*.json"]
# Deck labware definitions: registry.yaml at the package root + each
# definition's config YAML in a non-package subdir. Without these the
# `load_name:` deck-yaml feature breaks under `pip install` because the
# YAMLs don't get copied to site-packages.
"deck.labware.definitions" = [
    "registry.yaml",
    "*/*.yaml",
    "*/*.glb",
    "*/*.stl",
    "*/*.step",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
